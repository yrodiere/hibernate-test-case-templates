services:
  mongo-rs:
    image: mongo
    command: ["--replSet", "rs0", "--keyFile", "/mongodb-keyfile"]
    container_name: mongo-rs
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "password"
    ports:
      - 27017:27017
    volumes:
      - mongo-rs:/data/db
    post_start:
      - command: >
          sh -c "
            # Create cluster keyfile (required when using authentication and replica-set)
            if [ ! -f /mongodb-keyfile ]; then
              openssl rand -base64 756 > /mongodb-keyfile
              chmod 400 /mongodb-keyfile
              chown mongodb:mongodb /mongodb-keyfile
              echo
              echo 'Keyfile created successfully'
              echo
            fi
          "
      - command: >
          sh -c "
            while ! mongosh --quiet --eval \"db.adminCommand('ping')\"; do
              sleep 1
            done
            sleep 5
            if mongosh -u root -p password --quiet --eval 'rs.status().ok'; then
              echo
              echo 'Replica set already initialized'
              echo
            else
              # Setting the host to 127.0.0.1 is important because otherwise it would use the container ID
              # as the host name which would cause the replica set to not work when the container is rebuilt.
              mongosh -u root -p password --eval \"rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})\"
              echo
              echo 'Replica set initialized'
              echo
            fi
          "
volumes:
  mongo-rs: